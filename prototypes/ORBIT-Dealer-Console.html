<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ORBIT Dealer Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: side menu + work area; menu stacks above content on phones */
:root{--bg:#EEF1F4;--surface:#FFFFFF;--fg:#0E1A2B;--muted:#4A5568;--line:#D5DBE3;--accent:#C2500F;--accent-soft:#FBE6D8;--blue:#1F5FBF;--blue-soft:#E3ECF9;--good:#1E7A46;--good-soft:#E1F2E8;--warn:#9A4A0B;--side:#0E1A2B;--side-fg:#E8EDF4;--side-muted:#9AA6B6;--side-hi:#1C2B40;
--display:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans','Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#141E2E;--fg:#E8EDF4;--muted:#A3AEBE;--line:#2A3648;--accent:#F07A33;--accent-soft:#3A2414;--blue:#7FAEF0;--blue-soft:#18263C;--good:#5CC48A;--good-soft:#14301F;--warn:#F0A060;--side:#060B14;--side-hi:#141E2E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#141E2E;--fg:#E8EDF4;--muted:#A3AEBE;--line:#2A3648;--accent:#F07A33;--accent-soft:#3A2414;--blue:#7FAEF0;--blue-soft:#18263C;--good:#5CC48A;--good-soft:#14301F;--warn:#F0A060;--side:#060B14;--side-hi:#141E2E;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 230px;max-width:100%;background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
@media (min-width:860px){nav.side{flex:0 0 240px}}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:21px;padding:0 10px}
.dealer{font-size:12px;color:var(--side-muted);padding:0 10px 12px}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav{font:inherit;text-align:left;background:none;border:none;color:var(--side-fg);border-radius:8px;min-height:40px;padding:0 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav[aria-current="page"]{background:var(--side-hi);color:#FFFFFF;font-weight:600}
.nav .n{font-family:var(--mono);font-size:12px;color:var(--side-muted)}
.work{flex:999 1 560px;min-width:0;padding-block:24px 48px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.status{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--good-soft);color:var(--good)}
.tag.w{background:var(--accent-soft);color:var(--warn)}
.tag.b{background:var(--blue-soft);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--mono);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.w{border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-size:19px;margin:0}
.cols{display:flex;flex-wrap:wrap;gap:18px}
.cols>*{flex:1 1 320px;min-width:0}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:none}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;border:none;border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn.a{background:var(--accent);color:#FFFFFF}
.btn.g{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bands{display:flex;border-radius:10px;overflow:hidden;font-size:13px;font-weight:600;text-align:center}
.bands div{padding:12px 6px}
.b1{background:#1E7A46;color:#FFFFFF}.b2{background:#E8A33D;color:#0E1A2B}.b3{background:#B8480E;color:#FFFFFF}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],select{font:inherit;font-size:15px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px}
.detect{background:var(--blue-soft);border-radius:10px;padding:12px;font-size:14px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pipe div{background:var(--bg);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.pipe b{display:block;font-family:var(--mono);font-size:22px;color:var(--fg);font-weight:500}
.pipe .hot{background:var(--accent-soft);color:var(--warn)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{flex:1 1 110px;text-align:center;font-size:12px;padding:8px;border-radius:8px;border:1px solid var(--line)}
.steps .d{background:var(--blue);color:#FFFFFF;border-color:var(--blue)}
.steps .c{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;min-height:36px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.wa{background:#E5DDD5;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;color:#0E1A2B}
.wa .msg{background:#FFFFFF;border-radius:10px;padding:10px;font-size:13px}
.wa .q{border:1px solid #D5DBE3;border-radius:8px;padding:6px 8px;margin-top:6px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;max-width:360px}
.note{font-size:12px;color:var(--muted)}
/* Shopify-style dealer storefront */
.sbrand{display:flex;align-items:center;gap:10px;padding:0 10px}
.sbrand b{font-family:var(--display);font-size:16px;line-height:1.2;display:block}
.sbrand small{display:block;font-size:11px;color:var(--side-muted)}
.dmark{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px;color:#FFFFFF;flex:none}
.dswitch{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--side-muted);padding:10px 10px 4px}
.dswitch select{height:36px;font-size:13px;background:var(--side-hi);color:var(--side-fg);border-color:#2E3F57}
.store{display:flex;flex-wrap:wrap;gap:18px}.store>.panel{flex:1 1 360px;min-width:0}
.phone{width:240px;max-width:100%;border:8px solid var(--side);border-radius:28px;overflow:hidden;background:var(--bg);align-self:center}
.phone .ph{padding:12px;color:#FFFFFF;display:flex;align-items:center;gap:8px}
.phone .ph b{font-size:13px;display:block}.phone .ph small{font-size:9px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.phone .pb{padding:10px;display:flex;flex-direction:column;gap:6px;font-size:11px}
.phone .pb div{background:var(--surface);border-radius:8px;padding:8px}
.phone .pbtn{color:#FFFFFF;border-radius:8px;padding:8px;text-align:center;font-weight:600}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:36px;height:36px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.swb[aria-pressed="true"]{border-color:var(--fg)}
.applist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.appitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.appitem small{display:block;color:var(--muted);font-size:12px}
.appitem input{width:20px;height:20px;accent-color:var(--accent)}
/* Focus mode, north star, pilot lab */
.shell.core .xtra{display:none}
.modebox{display:flex;flex-direction:column;gap:6px;padding:4px 10px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted)}
.modebox .seg{border-color:#2E3F57;text-transform:none;letter-spacing:0}
.modebox .seg button{background:transparent;color:var(--side-fg);flex:1}
.modebox .seg button[aria-pressed="true"]{background:var(--accent);color:#FFFFFF}
.modenote{font-size:12px;color:var(--side-muted);padding:10px;margin:8px 0 0;line-height:1.4}
.north{background:var(--side);color:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.north .big{font-family:var(--mono);font-size:44px;line-height:1;color:#FFB27A}
.north small{color:var(--side-muted);font-size:13px;display:block}
.north .bars{display:flex;gap:6px;align-items:flex-end;height:48px}
.north .bars i{width:16px;background:#5B7A9E;border-radius:3px 3px 0 0;display:block}
.north .bars i:last-child{background:#FFB27A}
.owner{font-size:12px;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--blue-soft);color:var(--blue)}
.owner.late{background:var(--accent-soft);color:var(--warn)}
.persona{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.persona div{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.persona b{font-size:14px}
.persona small{color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:12px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:8px;background:var(--good)}
.loopcard{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.loopcard .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rolebar{align-self:flex-start;flex-wrap:wrap}
.rolebar button{min-height:40px;padding:0 16px;font-size:14px}
/* CRM and agent */
[hidden]{display:none!important}
.path{display:flex;gap:4px;overflow-x:auto}
.path button{font:inherit;font-size:13px;flex:1 1 0;min-width:110px;min-height:40px;border:none;cursor:pointer;background:var(--line);color:var(--fg);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.path button.done{background:var(--blue-soft);color:var(--blue)}
.path button.cur{background:var(--accent);color:#FFFFFF;font-weight:600}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hl div{font-size:12px;color:var(--muted)}
.hl b{display:block;font-size:15px;color:var(--fg);font-weight:600}
.rec{display:flex;flex-wrap:wrap;gap:16px}.rec>*{flex:1 1 320px;min-width:0}
.tl{display:flex;flex-direction:column;gap:10px}
.tl div{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.tl small{display:block;color:var(--muted);font-size:12px}
.sc{font-family:var(--mono);font-size:12px;border-radius:99px;padding:3px 9px;white-space:nowrap}
.sc.hi{background:var(--good-soft);color:var(--good)}.sc.mid{background:var(--blue-soft);color:var(--blue)}.sc.lo{background:var(--accent-soft);color:var(--warn)}
.rowlink{font:inherit;background:none;border:none;color:var(--blue);cursor:pointer;padding:0;text-align:left;font-weight:600}
.agentbox{display:flex;gap:8px;flex-wrap:wrap}
.agentbox input{flex:1 1 300px}
.plan{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.step .ic{width:24px;height:24px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);background:var(--bg)}
.step.ok .ic{background:var(--good);color:#FFFFFF}
.step.wait .ic{background:var(--accent);color:#FFFFFF}
.step small{display:block;color:var(--muted);font-size:12px}
.guard{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px;font-size:13px}
/* Lightning-style CRM workspace */
.crmws{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ws-global{display:flex;align-items:center;gap:12px;padding:8px clamp(12px,2vw,20px);background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.ws-waffle{width:40px;height:40px;display:grid;grid-template-columns:repeat(3,6px);gap:4px;align-content:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ws-waffle span{width:6px;height:6px;border-radius:2px;background:var(--muted)}
.ws-app{font-family:var(--display);font-size:18px;border-left:4px solid var(--ac);padding-left:8px}
.ws-search{flex:1 1 220px;max-width:520px}
.ws-search input{width:100%;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 14px}
.ws-agentbtn{font:inherit;font-weight:600;border:none;border-radius:99px;min-height:38px;padding:0 14px;cursor:pointer;background:var(--blue);color:#FFFFFF}
.ws-agentbtn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue-soft)}
.ws-close{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;min-height:38px;padding:0 12px;cursor:pointer}
.ws-tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 clamp(12px,2vw,20px);overflow-x:auto}
.ws-tab{font:inherit;font-size:14px;background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--fg);white-space:nowrap}
.ws-tab[aria-current="page"]{border-bottom-color:var(--blue);font-weight:600}
.ws-body{display:flex;flex:1;min-height:0;align-items:flex-start}
.ws-page{flex:1;min-width:0;padding:16px clamp(12px,2vw,20px) 48px;display:flex;flex-direction:column;gap:12px}
.ws-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ws-card h2{font-size:16px;margin:0}
.ws-grid{display:flex;flex-wrap:wrap;gap:12px}.ws-main{flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}.ws-side{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ws-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ws-kpis span,.ws-hlf div,.ws-det div{font-size:12px;color:var(--muted)}
.ws-kpis b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--fg)}
.ws-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ws-item small{display:block;color:var(--muted);font-size:12px}
.ws-ai{background:var(--blue-soft);border-color:var(--blue-soft)}
.ws-lhead,.ws-hltop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ws-lhead>div:first-child,.ws-hltop>div:nth-child(2){display:flex;align-items:center;gap:10px}
.ws-hltop>div:nth-child(2){flex:1}
.ws-lhead small,.ws-hltop small{color:var(--muted);font-size:12px;display:block}
.ws-obj{width:36px;height:36px;border-radius:8px;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ws-lact,.ws-hlbtn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:none;padding:0 12px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#FFFFFF}
.ws-kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto}
.ws-col{background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.ws-col h3{margin:0;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.ws-kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.ws-kcard small{color:var(--muted);font-size:12px}
.ws-krow{display:flex;justify-content:space-between;align-items:center}
.ws-mini{font:inherit;font-size:12px;background:none;border:none;color:var(--blue);cursor:pointer;padding:4px}
.ws-crumb{font:inherit;background:none;border:none;color:var(--blue);cursor:pointer;align-self:flex-start;padding:4px 0}
.ws-hl h2{font-size:22px}
.ws-hlf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;border-top:1px solid var(--line);padding-top:10px}
.ws-hlf b,.ws-det b{display:block;font-size:14px;color:var(--fg)}
.ws-det{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ws-pathfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ws-agent{flex:0 0 340px;max-width:100%;align-self:stretch;background:var(--surface);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
@media (max-width:820px){.ws-body{flex-direction:column}.ws-agent{flex:none;width:100%;border-left:none;border-top:1px solid var(--line);position:static;max-height:none}}
.ws-agh{display:flex;justify-content:space-between;align-items:center}
.ws-chat{display:flex;flex-direction:column;gap:8px}
.msg{border-radius:10px;padding:8px 10px;font-size:14px;max-width:90%}
.msg.me{align-self:flex-end;background:var(--blue);color:#FFFFFF}
.msg.bot{align-self:flex-start;background:var(--bg)}
.ws-agbtns{display:flex;gap:8px;flex-wrap:wrap}
.ws-agin{display:flex;gap:8px;margin-top:auto}
.ws-agin input{flex:1;min-width:0}
.ws-modal{position:fixed;inset:0;background:rgba(14,26,43,.45);display:flex;align-items:flex-start;justify-content:center;padding:80px 16px;z-index:30}
.ws-launch{width:100%;max-width:640px}
.ws-apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ws-appcard{font:inherit;color:var(--fg);text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ws-appcard small{color:var(--muted);font-size:12px}
.ws-waffle:focus-visible,.ws-tab:focus-visible,.ws-appcard:focus-visible,.seg button:focus-visible,.path button:focus-visible,.ws-close:focus-visible,.ws-agentbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>

<div class="shell">
<nav class="side" aria-label="Console">
<div class="sbrand" id="sbrand"></div>
<label class="dswitch" for="dsel">Prototype: preview as<select id="dsel"></select></label>
