<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ORBIT Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: fixed left rail of sections, main column of summary tiles then detail tables. Control-room density, insurer-broker navy with signal orange. */
:root{--bg:#F3F5F8;--surface:#FFFFFF;--fg:#14202E;--muted:#5B6878;--line:#DCE2EA;--rail:#0F1C2E;--rail-fg:#C9D3DF;--accent:#E8641E;--accent-soft:#FDEBDF;--blue:#1F4FB8;--blue-soft:#E3EBFA;--good:#1E7A4C;--good-soft:#E1F3E9;--warn:#A85A00;--warn-soft:#FBEFD9;--bad:#B3261E;--bad-soft:#F9E1DF;
 --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A111C;--surface:#121C2B;--fg:#E6ECF3;--muted:#9AA8B8;--line:#26344A;--rail:#060C15;--rail-fg:#A9B6C6;--accent:#F2813F;--accent-soft:#3A2414;--blue:#7FA6F0;--blue-soft:#18263C;--good:#5CC48A;--good-soft:#123222;--warn:#F0A060;--warn-soft:#352612;--bad:#F08A80;--bad-soft:#3A1715;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A111C;--surface:#121C2B;--fg:#E6ECF3;--muted:#9AA8B8;--line:#26344A;--rail:#060C15;--rail-fg:#A9B6C6;--accent:#F2813F;--accent-soft:#3A2414;--blue:#7FA6F0;--blue-soft:#18263C;--good:#5CC48A;--good-soft:#123222;--warn:#F0A060;--warn-soft:#352612;--bad:#F08A80;--bad-soft:#3A1715;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-fg);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;color:#fff}
.logo b{font-size:17px;letter-spacing:.5px}.logo small{display:block;font-size:11px;color:var(--rail-fg);letter-spacing:1px;text-transform:uppercase}
.orb{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);position:relative}.orb::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);top:-4px;left:9px}
.grp{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#7E8DA0;padding:14px 10px 4px}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--rail-fg)}
.nav:hover{background:rgba(255,255,255,.06)}.nav[aria-current="page"]{background:rgba(232,100,30,.18);color:#fff}
.nav:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav span{font:500 11px var(--mono);color:#8FA0B4}
main{padding:24px 28px 48px;min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;font-weight:600;text-wrap:balance}.head p{margin:4px 0 0;color:var(--muted)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--blue-soft);color:var(--blue)}
.chip.g{background:var(--good-soft);color:var(--good)}.chip.w{background:var(--warn-soft);color:var(--warn)}.chip.b{background:var(--bad-soft);color:var(--bad)}.chip.a{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12px}.kpi b{font:600 24px var(--sans);font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:600}.note{color:var(--muted);font-size:12.5px;margin:0}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:right;font-family:var(--mono);font-size:13px}
tr:last-child td{border-bottom:none}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--blue)}
.bar.a i{background:var(--accent)}.bar.g i{background:var(--good)}
.btn{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;background:var(--fg);color:var(--surface);font-weight:500;font-size:13px}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.a{background:var(--accent);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alertrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--bg)}
.alertrow b{display:block}
.funnel{display:flex;gap:0}.funnel div{flex:1;padding:12px;border:1px solid var(--line);border-left:none;display:flex;flex-direction:column;gap:2px}
.funnel div:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 8px}.funnel div:last-child{border-radius:0 8px 8px 0}
.funnel span{font-size:12px;color:var(--muted)}.funnel b{font:600 20px var(--sans);font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:20px;right:20px;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.menu{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px}.grp,.logo small{display:none}.cols{grid-template-columns:1fr}main{padding:16px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
<nav class="rail" aria-label="Command centre sections">
 <div class="logo"><div class="orb" aria-hidden="true"></div><div><b>ORBIT</b><small>Command centre</small></div></div>
 <div class="grp">Network</div>
 <button class="nav" data-v="overview">Network overview</button>
 <button class="nav" data-v="dealer">Dealer 360</button>
 <div class="grp">Customer lifecycle</div>
 <button class="nav" data-v="renewals">Renewals</button>
 <button class="nav" data-v="claims">Claims<span id="nclaims"></span></button>
 <button class="nav" data-v="vas">Value-added services</button>
 <button class="nav" data-v="nbfc">NBFC and loans</button>
 <div class="grp">Partners</div>
 <button class="nav" data-v="insurers">Insurers and approvals<span id="nappr"></span></button>
 <button class="nav" data-v="price">Price intelligence</button>
 <div class="grp">Control</div>
 <button class="nav" data-v="compliance">Compliance</button>
 <button class="nav" data-v="revenue">Revenue and billing</button>
</nav>
<main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- deterministic sample data (fictional) ----------
let seed=42;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=a=>a[Math.floor(R()*a.length)];const ri=(a,b)=>Math.floor(a+R()*(b-a+1));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');const cr=n=>'₹'+(n/1e7).toFixed(2)+' Cr';const lk=n=>'₹'+(n/1e5).toFixed(1)+' L';const pct=n=>(n).toFixed(1)+'%';
const OEMS=['Royal Enfield','Hero MotoCorp','TVS Motor','Bajaj Auto','Honda 2W','Maruti Suzuki','Tata Motors'];
const ZONES={North:['New Delhi','Noida','Lucknow','Chandigarh','Jaipur','Kanpur','Dehradun'],West:['Mumbai','Pune','Ahmedabad','Surat','Nagpur'],South:['Bengaluru','Chennai','Hyderabad','Kochi','Coimbatore'],East:['Kolkata','Patna','Bhubaneswar','Guwahati','Ranchi']};
const INS=['Suraksha General','Kavach Insurance','Nirbhay General','Aarohan Assurance','Sahyog General','Pragati General','Setu General','Udaan Insurance'];
const NBFC=['Udaan Finance','Setu Credit','Pragati NBFC','Kosh Capital','Vriddhi Finance'];
const NAMES=['Royal','Capital','City','Highway','Prime','Galaxy','Unity','Shakti','Metro','Pioneer','Sun','Ganga','Yamuna','Everest','Coastal'];
const DEALERS=[];Object.entries(ZONES).forEach(([z,cs])=>cs.forEach(c=>{for(let k=0;k<2;k++){const o=pick(OEMS);const pol=ri(60,420);const ren=0.38+R()*0.4;DEALERS.push({id:'D'+String(DEALERS.length+1).padStart(4,'0'),name:pick(NAMES)+' '+o.split(' ')[0]+' '+c,oem:o,city:c,zone:z,plan:pick(['Starter','Growth','Growth','3S Pro']),policies:pol,premium:pol*ri(9000,26000),renew:ren,claims:Math.round(pol*(0.06+R()*0.1)),inWorkshop:0.4+R()*0.45,vas:ri(4,60),vasRev:0,loans:ri(2,40),cbOpen:ri(0,9),cbOver:0,appUsers:0.35+R()*0.5,compliance:0.7+R()*0.3,priceGap:-2+R()*16,ver:0})}}));
DEALERS.forEach(d=>{d.vasRev=d.vas*ri(4500,9000);d.cbOver=Math.min(d.cbOpen,ri(0,3));d.lr=(42+R()*45)});
const CLAIMS=[];const STAGES=['Intimated','Survey','Estimate approved','Repair in progress','Settled'];
for(let i=0;i<60;i++){const d=pick(DEALERS);CLAIMS.push({id:'CL-'+(7100+i),dealer:d,cust:'[Customer '+(i+1)+']',ins:pick(INS),stage:pick(STAGES),where:R()<d.inWorkshop?'Dealer workshop':pick(['Other dealer','Outside garage']),amt:ri(4000,85000),days:ri(1,21)})}
const APPR=[];for(let i=0;i<14;i++){const d=pick(DEALERS);const ours=ri(9000,26000);const k=pick(['Quote match','Quote match','Discount request','Claim estimate above limit','Endorsement']);APPR.push({id:i,kind:k,dealer:d,ins:pick(INS),detail:k==='Quote match'?`Match ${pick(INS)} via ${pick(['web aggregator','insurer app','POSP agent'])} at ${inr(ours*0.88)} (ours ${inr(ours)})`:k==='Discount request'?'Retention discount, 6 days to expiry':k==='Endorsement'?'Hypothecation change':'Workshop estimate above auto-approve limit',amt:k==='Quote match'?Math.round(ours*0.12):ri(1500,40000),age:ri(1,40),st:'Pending'})}
const LOANS=[];for(let i=0;i<40;i++){const d=pick(DEALERS);LOANS.push({dealer:d,nbfc:pick(NBFC),purpose:pick(['Insurance premium','Repair bill','Accessories','New vehicle','Service package']),amt:ri(8000,180000),st:pick(['Offer viewed','Applied','Approved','Disbursed','Disbursed','Rejected'])})}
const S={v:'overview',dealer:DEALERS[0].id,zone:'All',claimStage:'All'};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function head(t,sub,right=''){return `<div class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="row">${right}</div></div>`}
function zoneSel(){return `<label class="row note" for="zone">Zone <select id="zone">${['All',...Object.keys(ZONES)].map(z=>`<option ${z===S.zone?'selected':''}>${z}</option>`).join('')}</select></label>`}
const net=()=>S.zone==='All'?DEALERS:DEALERS.filter(d=>d.zone===S.zone);
const bar=(v,max,c='')=>`<div class="bar ${c}"><i style="width:${Math.max(2,Math.min(100,v/max*100))}%"></i></div>`;
const chipFor=(v,good,ok)=>v>=good?'g':v>=ok?'w':'b';

// ---------- views ----------
const V={
overview(){const D=net();const pol=sum(D,d=>d.policies),prem=sum(D,d=>d.premium),cl=sum(D,d=>d.claims),cbO=sum(D,d=>d.cbOver);
 const ren=sum(D,d=>d.renew*d.policies)/pol,ws=sum(D,d=>d.inWorkshop*d.claims)/cl,app=sum(D,d=>d.appUsers*d.policies)/pol;
 const sub=sum(D,d=>({Starter:4999,Growth:9999,'3S Pro':22499})[d.plan]*12);
 const worst=[...D].sort((a,b)=>a.renew-b.renew).slice(0,5);
 const alerts=[[`${cbO} call-backs overdue across ${D.filter(d=>d.cbOver).length} dealers`,'Auto-rerouting to nearest dealer at 24 h','w'],
  [`${APPR.filter(a=>a.st==='Pending'&&a.age>24).length} insurer approvals waiting over 24 h`,'Chase in Insurers and approvals','b'],
  [`${D.filter(d=>d.priceGap>8).length} dealers losing on price by more than 8%`,'Evidence packs ready in Price intelligence','a'],
  [`${D.filter(d=>d.compliance<0.8).length} dealers below 80% compliance`,'Bima Sugam display or consent logs missing','w']];
 return head('Network overview',`${D.length} dealerships shown (sample of the 15,000 universe) · all OEMs`,zoneSel())+
 `<div class="kpis"><div class="kpi"><span>Dealers live</span><b>${D.length}</b><small>${D.filter(d=>d.plan==='3S Pro').length} on 3S Pro</small></div>
 <div class="kpi"><span>Policies this year</span><b>${pol.toLocaleString('en-IN')}</b><small>${cr(prem)} premium</small></div>
 <div class="kpi"><span>Renewal rate</span><b>${pct(ren*100)}</b><small>through own dealer</small></div>
 <div class="kpi"><span>Claims in dealer workshop</span><b>${pct(ws*100)}</b><small>${cl.toLocaleString('en-IN')} claims</small></div>
 <div class="kpi"><span>Customers on app</span><b>${pct(app*100)}</b><small>daily reminders on</small></div>
 <div class="kpi alert"><span>Subscription ARR</span><b>${cr(sub)}</b><small>+ ${lk(sum(D,d=>d.vasRev)*0.08)} VAS fees</small></div></div>
 <div class="cols"><div class="panel"><h2>Needs attention today</h2><div class="alerts">${alerts.map(([a,b,c])=>`<div class="alertrow"><span class="chip ${c}">${c==='b'?'Urgent':c==='a'?'Revenue':'Watch'}</span><div><b>${a}</b><span class="note">${b}</span></div></div>`).join('')}</div></div>
 <div class="panel"><h2>Customer lifecycle across the network</h2><div class="funnel"><div><span>Policies sold</span><b>${pol.toLocaleString('en-IN')}</b></div><div><span>On the app</span><b>${Math.round(pol*app).toLocaleString('en-IN')}</b></div><div><span>Renewed</span><b>${Math.round(pol*ren).toLocaleString('en-IN')}</b></div><div><span>VAS bought</span><b>${sum(D,d=>d.vas)}</b></div><div><span>Loans</span><b>${sum(D,d=>d.loans)}</b></div></div><p class="note">From first sale through renewal, claims, service packages and finance.</p></div></div>
 <div class="panel"><h2>Lowest renewal rates</h2><div class="tbl"><table><tr><th>Dealer</th><th>OEM</th><th>Zone</th><th>Renewal</th><th></th><th>Price gap</th><th></th></tr>
 ${worst.map(d=>`<tr><td>${d.name}</td><td>${d.oem}</td><td>${d.zone}</td><td class="n">${pct(d.renew*100)}</td><td>${bar(d.renew,1,'a')}</td><td class="n">${pct(d.priceGap)}</td><td><button class="btn g" data-open="${d.id}">Open 360</button></td></tr>`).join('')}</table></div></div>`},

dealer(){const d=DEALERS.find(x=>x.id===S.dealer);const dc=CLAIMS.filter(c=>c.dealer===d),dl=LOANS.filter(l=>l.dealer===d),da=APPR.filter(a=>a.dealer===d);
 return head('Dealer 360',`${d.name} · ${d.oem} · ${d.city}, ${d.zone} · plan ${d.plan}`,`<label class="row note" for="dsel">Dealer <select id="dsel">${DEALERS.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${x.name}</option>`).join('')}</select></label>`)+
 `<div class="kpis"><div class="kpi"><span>Policies</span><b>${d.policies}</b><small>${lk(d.premium)} premium</small></div>
 <div class="kpi"><span>Renewal rate</span><b>${pct(d.renew*100)}</b><small><span class="chip ${chipFor(d.renew,.65,.5)}">${d.renew>=.65?'Healthy':d.renew>=.5?'Watch':'At risk'}</span></small></div>
 <div class="kpi"><span>Claims</span><b>${d.claims}</b><small>${pct(d.inWorkshop*100)} in own workshop</small></div>
 <div class="kpi"><span>Loss ratio</span><b>${pct(d.lr)}</b><small>all insurers</small></div>
 <div class="kpi"><span>VAS sold</span><b>${d.vas}</b><small>${lk(d.vasRev)}</small></div>
 <div class="kpi"><span>Loans</span><b>${d.loans}</b><small>via NBFC partners</small></div>
 <div class="kpi"><span>Open call-backs</span><b>${d.cbOpen}</b><small>${d.cbOver} overdue</small></div>
 <div class="kpi"><span>Compliance</span><b>${pct(d.compliance*100)}</b><small>${d.compliance<.8?'Action needed':'OK'}</small></div></div>
 <div class="cols"><div class="panel"><h2>Claims at this dealer</h2><div class="tbl"><table><tr><th>Claim</th><th>Insurer</th><th>Stage</th><th>Repaired at</th><th>Amount</th></tr>${dc.map(c=>`<tr><td>${c.id}</td><td>${c.ins}</td><td>${c.stage}</td><td>${c.where==='Dealer workshop'?c.where:`<span class="chip b">${c.where}</span>`}</td><td class="n">${inr(c.amt)}</td></tr>`).join('')||'<tr><td colspan="5">No recent claims.</td></tr>'}</table></div></div>
 <div class="panel"><h2>Pending with insurers</h2><div class="tbl"><table><tr><th>Request</th><th>Insurer</th><th>Waiting</th></tr>${da.map(a=>`<tr><td>${a.kind}<br><span class="note">${a.detail}</span></td><td>${a.ins}</td><td class="n">${a.age} h</td></tr>`).join('')||'<tr><td colspan="3">Nothing pending.</td></tr>'}</table></div>
 <h2>Loans</h2><div class="tbl"><table><tr><th>NBFC</th><th>Purpose</th><th>Amount</th><th>Status</th></tr>${dl.map(l=>`<tr><td>${l.nbfc}</td><td>${l.purpose}</td><td class="n">${inr(l.amt)}</td><td>${l.st}</td></tr>`).join('')||'<tr><td colspan="4">No loans yet.</td></tr>'}</table></div></div></div>
 <div class="panel"><h2>Account actions</h2><div class="row"><button class="btn" data-toast="Relationship manager notified">Assign RM visit</button><button class="btn g" data-toast="Renewal campaign scheduled for this dealer">Run renewal campaign</button><button class="btn g" data-toast="Plan upgrade proposal sent">Propose plan upgrade</button><button class="btn g" data-toast="Compliance checklist sent to dealer">Send compliance checklist</button></div></div>`},

renewals(){const D=net();const due=sum(D,d=>Math.round(d.policies/12));
 const by=[...D].sort((a,b)=>b.policies-a.policies).slice(0,10);
 return head('Renewals','Policies due across the network and how each dealer is converting',zoneSel())+
 `<div class="kpis"><div class="kpi"><span>Due in 30 days</span><b>${due.toLocaleString('en-IN')}</b></div><div class="kpi"><span>Nudged by AI autopilot</span><b>${Math.round(due*.92).toLocaleString('en-IN')}</b></div><div class="kpi"><span>Self-quoted in app</span><b>${Math.round(due*.31).toLocaleString('en-IN')}</b></div><div class="kpi"><span>Renewed so far</span><b>${Math.round(due*.44).toLocaleString('en-IN')}</b></div></div>
 <div class="panel"><h2>Renewal conversion by dealer</h2><div class="tbl"><table><tr><th>Dealer</th><th>Due</th><th>Renewal rate</th><th></th><th>Lost on price</th></tr>${by.map(d=>`<tr><td>${d.name}</td><td class="n">${Math.round(d.policies/12)}</td><td class="n">${pct(d.renew*100)}</td><td>${bar(d.renew,1,d.renew<.5?'a':'g')}</td><td class="n">${Math.round(d.policies/12*(1-d.renew)*.45)}</td></tr>`).join('')}</table></div></div>`},

claims(){const C=S.claimStage==='All'?CLAIMS:CLAIMS.filter(c=>c.stage===S.claimStage);const ws=CLAIMS.filter(c=>c.where==='Dealer workshop').length;
 return head('Claims','Every claim on policies sold through ORBIT dealers, wherever it is repaired',`<label class="row note" for="cst">Stage <select id="cst">${['All',...STAGES].map(s=>`<option ${s===S.claimStage?'selected':''}>${s}</option>`).join('')}</select></label>`)+
 `<div class="kpis">${STAGES.map(s=>`<div class="kpi"><span>${s}</span><b>${CLAIMS.filter(c=>c.stage===s).length}</b></div>`).join('')}<div class="kpi alert"><span>Repaired at dealer workshop</span><b>${pct(ws/CLAIMS.length*100)}</b><small>${CLAIMS.length-ws} leaked to others</small></div></div>
 <div class="panel"><h2>Claims register</h2><div class="tbl"><table><tr><th>Claim</th><th>Customer</th><th>Dealer</th><th>Insurer</th><th>Stage</th><th>Repaired at</th><th>Days</th><th>Amount</th></tr>${C.map(c=>`<tr><td>${c.id}</td><td>${c.cust}</td><td>${c.dealer.name}</td><td>${c.ins}</td><td>${c.stage}</td><td>${c.where==='Dealer workshop'?c.where:`<span class="chip b">${c.where}</span>`}</td><td class="n">${c.days}${c.days>14&&c.stage!=='Settled'?' <span class="chip w">Slow</span>':''}</td><td class="n">${inr(c.amt)}</td></tr>`).join('')}</table></div>
 <p class="note">Claims are reported by the customer in the app, by the dealer, or by the insurer's feed; leakage to outside garages is tracked per dealer.</p></div>`},

vas(){const D=net();const pk=sum(D,d=>Math.round(d.vas*.6)),ew=sum(D,d=>d.vas)-pk;
 return head('Value-added services','Service packages and extended warranty sold through dealers and the customer app',zoneSel())+
 `<div class="kpis"><div class="kpi"><span>Service packages</span><b>${pk}</b><small>2, 3 and 5 years</small></div><div class="kpi"><span>Extended warranties</span><b>${ew}</b><small>priced on vehicle health</small></div><div class="kpi"><span>Inspections done</span><b>${Math.round(ew*1.3)}</b><small>${Math.round(ew*.3)} not eligible</small></div><div class="kpi alert"><span>VAS value</span><b>${cr(sum(D,d=>d.vasRev))}</b><small>platform fee ${lk(sum(D,d=>d.vasRev)*.08)}</small></div></div>
 <div class="cols"><div class="panel"><h2>Mix by package</h2><div class="tbl"><table><tr><th>Product</th><th>Sold</th><th></th></tr>${[['2-year service package',.22],['3-year service package',.24],['5-year service package',.14],['Extended warranty +1 yr',.18],['Extended warranty +2 yr',.15],['Extended warranty +3 yr',.07]].map(([n,f])=>`<tr><td>${n}</td><td class="n">${Math.round(sum(D,d=>d.vas)*f)}</td><td>${bar(f,.25)}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h2>Top dealers</h2><div class="tbl"><table><tr><th>Dealer</th><th>Sold</th><th>Value</th></tr>${[...D].sort((a,b)=>b.vasRev-a.vasRev).slice(0,8).map(d=>`<tr><td>${d.name}</td><td class="n">${d.vas}</td><td class="n">${lk(d.vasRev)}</td></tr>`).join('')}</table></div></div></div>`},

nbfc(){const by=NBFC.map(n=>{const L=LOANS.filter(l=>l.nbfc===n);return{n,cnt:L.length,dis:L.filter(l=>l.st==='Disbursed'),rej:L.filter(l=>l.st==='Rejected').length}});
 return head('NBFC and loans','Insta loans offered in the customer app and at the dealer, from RBI-registered lenders')+
 `<div class="kpis"><div class="kpi"><span>Applications</span><b>${LOANS.length}</b></div><div class="kpi"><span>Disbursed</span><b>${LOANS.filter(l=>l.st==='Disbursed').length}</b><small>${inr(sum(LOANS.filter(l=>l.st==='Disbursed'),l=>l.amt))}</small></div><div class="kpi"><span>Premium financed</span><b>${LOANS.filter(l=>l.purpose==='Insurance premium').length}</b><small>paid direct to insurer</small></div><div class="kpi"><span>Approval rate</span><b>${pct(LOANS.filter(l=>['Approved','Disbursed'].includes(l.st)).length/LOANS.length*100)}</b></div></div>
 <div class="panel"><h2>By lender</h2><div class="tbl"><table><tr><th>NBFC</th><th>Applications</th><th>Disbursed</th><th>Amount</th><th>Rejected</th></tr>${by.map(b=>`<tr><td>${b.n}</td><td class="n">${b.cnt}</td><td class="n">${b.dis.length}</td><td class="n">${inr(sum(b.dis,l=>l.amt))}</td><td class="n">${b.rej}</td></tr>`).join('')}</table></div>
 <p class="note">Every offer shows a Key Fact Statement and a cooling-off period; checking offers uses a soft credit check. ORBIT earns a flat referral fee, never tied to the insurance sale.</p></div>
 <div class="panel"><h2>By purpose</h2><div class="tbl"><table><tr><th>Purpose</th><th>Loans</th><th></th></tr>${['Insurance premium','Repair bill','Accessories','New vehicle','Service package'].map(p=>{const c=LOANS.filter(l=>l.purpose===p).length;return `<tr><td>${p}</td><td class="n">${c}</td><td>${bar(c,15)}</td></tr>`}).join('')}</table></div></div>`},

insurers(){const P=APPR.filter(a=>a.st==='Pending');
 return head('Insurers and approvals','Requests from dealers waiting on insurers, and how each insurer performs')+
 `<div class="panel"><h2>Waiting on insurers · ${P.length}</h2><div class="tbl"><table><tr><th>Request</th><th>Dealer</th><th>Insurer</th><th>Value</th><th>Waiting</th><th></th></tr>${P.map(a=>`<tr><td><b>${a.kind}</b><br><span class="note">${a.detail}</span></td><td>${a.dealer.name}</td><td>${a.ins}</td><td class="n">${inr(a.amt)}</td><td class="n">${a.age} h ${a.age>24?'<span class="chip b">Over SLA</span>':''}</td><td><button class="btn g" data-chase="${a.id}">Chase</button></td></tr>`).join('')||'<tr><td colspan="6">Nothing waiting.</td></tr>'}</table></div>
 <p class="note">Quote-match requests are raised by dealers with evidence and approved or declined by the insurer; ORBIT tracks the SLA and escalates.</p></div>
 <div class="panel"><h2>Insurer scorecard</h2><div class="tbl"><table><tr><th>Insurer</th><th>Loss ratio</th><th>Avg approval time</th><th>Quote matches approved</th><th>Claims settled in 7 days</th></tr>${INS.map(n=>`<tr><td>${n}</td><td class="n">${pct(45+R()*45)}</td><td class="n">${ri(4,40)} h</td><td class="n">${pct(40+R()*50)}</td><td class="n">${pct(55+R()*40)}</td></tr>`).join('')}</table></div></div>`},

price(){const D=net();const top=[...D].sort((a,b)=>b.priceGap-a.priceGap).slice(0,10);
 return head('Price intelligence','Where our quotes lose to other channels, from dealer quote matches and field audits',zoneSel())+
 `<div class="kpis"><div class="kpi"><span>Cases recorded</span><b>${sum(D,d=>ri(2,14))}</b></div><div class="kpi"><span>Average gap</span><b>${pct(sum(D,d=>d.priceGap)/D.length)}</b><small>ours above market</small></div><div class="kpi alert"><span>Dealers above 8% gap</span><b>${D.filter(d=>d.priceGap>8).length}</b></div></div>
 <div class="cols"><div class="panel"><h2>Gap by competitor channel</h2><div class="tbl"><table><tr><th>Channel</th><th>Avg gap</th><th></th></tr>${[['Web aggregator',9.8],['Insurer website or app',7.1],['POSP agent',5.4],['Other dealer',2.2],['Bank or NBFC',3.6]].map(([c,g])=>`<tr><td>${c}</td><td class="n">${pct(g)}</td><td>${bar(g,12,'a')}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h2>Dealers losing most on price</h2><div class="tbl"><table><tr><th>Dealer</th><th>Gap</th></tr>${top.map(d=>`<tr><td>${d.name}</td><td class="n">${pct(d.priceGap)}</td></tr>`).join('')}</table></div></div></div>
 <div class="panel"><div class="row"><button class="btn a" data-toast="Evidence packs prepared for all insurers">Prepare insurer evidence packs</button><span class="note">No automated scraping: data comes from quote matches, authorised field audits and lost-renewal reasons.</span></div></div>`},

compliance(){const D=net();const items=[['Bima Sugam option shown at sale',.94],['Purpose-wise consent captured (DPDP)',.97],['Policy tagged to registered salesperson',.91],['Premium paid direct to insurer',.99],['Salesperson licences valid',.88],['Records retained 7 years',1]];
 return head('Compliance','IRDAI and DPDP obligations tracked across every dealer',zoneSel())+
 `<div class="panel"><h2>Network checklist</h2><div class="tbl"><table><tr><th>Obligation</th><th>Compliance</th><th></th><th>Status</th></tr>${items.map(([n,v])=>`<tr><td>${n}</td><td class="n">${pct(v*100)}</td><td>${bar(v,1,v>=.95?'g':'a')}</td><td><span class="chip ${chipFor(v,.95,.9)}">${v>=.95?'On track':v>=.9?'Watch':'Act now'}</span></td></tr>`).join('')}</table></div><p class="note">Proposed IRDAI items track the Sept 2026 consultation paper and will be updated once rules are notified.</p></div>
 <div class="panel"><h2>Dealers needing action</h2><div class="tbl"><table><tr><th>Dealer</th><th>Score</th><th></th></tr>${D.filter(d=>d.compliance<.82).map(d=>`<tr><td>${d.name}</td><td class="n">${pct(d.compliance*100)}</td><td><button class="btn g" data-toast="Checklist sent to ${d.name}">Send checklist</button></td></tr>`).join('')||'<tr><td colspan="3">All dealers above threshold.</td></tr>'}</table></div></div>`},

revenue(){const D=net();const P={Starter:4999,Growth:9999,'3S Pro':22499};const sub=sum(D,d=>P[d.plan]*12),vas=sum(D,d=>d.vasRev)*.08,on=D.length*20000,nb=LOANS.filter(l=>l.st==='Disbursed').length*1500;
 const lines=[['Dealer subscriptions',sub],['Value-added services platform fee',vas],['Onboarding fees',on],['NBFC referral fees',nb],['Insurer analytics licences',INS.length*400000]];const tot=sum(lines,l=>l[1]);
 return head('Revenue and billing','Recurring revenue that does not depend on commission rates',zoneSel())+
 `<div class="kpis"><div class="kpi alert"><span>Annual revenue run-rate</span><b>${cr(tot)}</b></div>${['Starter','Growth','3S Pro'].map(p=>`<div class="kpi"><span>${p} dealers</span><b>${D.filter(d=>d.plan===p).length}</b><small>${inr(P[p])} / month</small></div>`).join('')}</div>
 <div class="panel"><h2>Revenue by stream</h2><div class="tbl"><table><tr><th>Stream</th><th>Annual</th><th>Share</th><th></th></tr>${lines.map(([n,v])=>`<tr><td>${n}</td><td class="n">${lk(v)}</td><td class="n">${pct(v/tot*100)}</td><td>${bar(v,tot)}</td></tr>`).join('')}</table></div><p class="note">Sample network only; prices are planning assumptions. Scale to the 15,000 universe in the cost model.</p></div>`}
};
function render(){$('#main').innerHTML=V[S.v]();document.querySelectorAll('.nav').forEach(n=>n.setAttribute('aria-current',n.dataset.v===S.v?'page':'false'));
 $('#nclaims').textContent=CLAIMS.filter(c=>c.stage!=='Settled').length;$('#nappr').textContent=APPR.filter(a=>a.st==='Pending').length}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){S.v=b.dataset.v;render();window.scrollTo(0,0);return}
 if(b.dataset.open){S.dealer=b.dataset.open;S.v='dealer';render();window.scrollTo(0,0);return}
 if(b.dataset.chase){const a=APPR[+b.dataset.chase];toast('Reminder sent to '+a.ins+' for '+a.kind.toLowerCase());return}
 if(b.dataset.toast){toast(b.dataset.toast)}});
document.addEventListener('change',e=>{if(e.target.id==='zone'){S.zone=e.target.value;render()}if(e.target.id==='dsel'){S.dealer=e.target.value;render()}if(e.target.id==='cst'){S.claimStage=e.target.value;render()}});
render();
</script>

</body>
</html>
